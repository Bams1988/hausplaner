name: Mindora

on:
  schedule:
    - cron: '*/15 * * * *'   # alle 15 Minuten (GitHub startet manchmal etwas später)
  workflow_dispatch:
    inputs:
      test:
        description: 'Test-Nachricht an alle Geräte senden'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: mindora
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Sucht die Programmdateien im Repository – egal, in welchem Ordner sie liegen.
      - name: Programm zusammenstellen
        run: |
          set -e
          finde() { find . -name "$1" -not -path './_run/*' -not -path '*/node_modules/*' -not -path './.git/*' | head -1; }
          fehlt=""
          for f in send-reminders.mjs inbox.mjs ai.js parser.js store.js; do
            [ -z "$(finde $f)" ] && fehlt="$fehlt $f"
          done
          if [ -n "$fehlt" ]; then
            echo "::error::Diese Dateien fehlen im Repository:$fehlt – bitte hochladen (Add file → Upload files)."
            exit 1
          fi
          mkdir -p _run/scripts
          cp "$(finde send-reminders.mjs)" "$(finde inbox.mjs)" _run/scripts/
          cp "$(finde ai.js)" "$(finde parser.js)" "$(finde store.js)" _run/
          echo '{"type":"module","private":true}' > _run/package.json
          echo '{"type":"module","private":true}' > _run/scripts/package.json
          cd _run/scripts
          npm install --no-audit --no-fund --loglevel=error firebase-admin@13 imapflow@1 mailparser@3
      - name: E-Mails abholen, erinnern, Fristen prüfen
        working-directory: _run/scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          INBOX_USER: ${{ secrets.INBOX_USER }}
          INBOX_PASSWORD: ${{ secrets.INBOX_PASSWORD }}
          INBOX_PROJECT: ${{ vars.INBOX_PROJECT }}
          APP_URL: ${{ vars.APP_URL }}
          TEST_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: node send-reminders.mjs
      # GitHub pausiert Zeitpläne nach 60 Tagen ohne Änderung im Repository.
      # Dieser Schritt macht alle 50 Tage einen leeren Commit, damit alles weiterläuft.
      - name: Zeitplan aktiv halten
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 4320000 ]; then
            git config user.name "mindora-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Zeitplan aktiv halten"
            git push
          fi
